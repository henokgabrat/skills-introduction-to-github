name: Step 2, Commit a file

# This step listens for the learner to commit a file to branch `my-first-branch`.
# This workflow updates from step 2 to step 3.

# WF-02: Prompt Reminder Feature
# This workflow includes a prompt reminder that helps users remember their current task.
# The reminder outputs the step instructions to help guide learners through the process.

# This action will run every time there's a push to `my-first-branch`.
# Reference: https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
on:
  workflow_dispatch:
  push:
    branches:
      - my-first-branch

# Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  # Need `contents: read` to checkout the repository.
  # Need `contents: write` to update the step metadata.
  # Need `issues: write` to create reminder issues.
  contents: write
  issues: write

jobs:
  # Get the current step to only run the main job when the learner is on the same step.
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  # WF-02: Prompt Reminder Job
  # This job provides a reminder of the current step's prompt/instructions
  # Can be triggered manually via workflow_dispatch to help users remember their task
  prompt_reminder:
    name: Prompt Reminder
    needs: get_current_step
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && needs.get_current_step.outputs.current_step == 2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display Step 2 Prompt Reminder
        run: |
          echo "🔔 PROMPT REMINDER FOR STEP 2"
          echo "=============================="
          echo ""
          cat ./.github/steps/2-commit-a-file.md
          echo ""
          echo "=============================="
          echo "💡 TIP: Create a file named PROFILE.md with the content:"
          echo "   'Welcome to my GitHub profile!'"
          echo "=============================="

      - name: Create Reminder Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📝 Prompt Reminder: Step 2 - Commit a file',
              body: `## Your Current Task\n\nYou are on **Step 2: Commit a file**.\n\n### What you need to do:\n\n1. Make sure you're on branch \`my-first-branch\`\n2. Create a new file named \`PROFILE.md\`\n3. Add this content to the file:\n   \`\`\`\n   Welcome to my GitHub profile!\n   \`\`\`\n4. Commit the changes with the message: \`Add PROFILE.md\`\n\n### Why this matters:\n\nA **commit** is a set of changes to the files and folders in your project. Learning to commit is fundamental to using Git and GitHub!\n\n---\n*This reminder was automatically generated by the WF-02 Prompt Reminder workflow.*`
            });
            console.log(`Created reminder issue #${issue.data.number}`);

  on_commit_a_file:
    name: On commit a file
    needs: get_current_step

    # We will only run this action when:
    # 1. This repository isn't the template repository.
    # 2. The step is currently 2.
    # Reference: https://docs.github.com/en/actions/learn-github-actions/contexts
    # Reference: https://docs.github.com/en/actions/learn-github-actions/expressions
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 2 }}

    # We'll run Ubuntu for performance instead of Mac or Windows.
    runs-on: ubuntu-latest

    steps:
      # We'll need to check out the repository so that we can edit the README.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Let's get all the branches.

      # WF-02 Prompt Reminder: Output current step instructions
      - name: Prompt Reminder - Display current task
        run: |
          echo "📝 PROMPT REMINDER - Step 2: Commit a file"
          echo "==========================================="
          echo ""
          echo "Your current task is to commit a file to your branch."
          echo ""
          echo "Instructions:"
          echo "1. Make sure you're on branch 'my-first-branch'"
          echo "2. Create a new file named 'PROFILE.md'"
          echo "3. Add the content: 'Welcome to my GitHub profile!'"
          echo "4. Commit the changes with message: 'Add PROFILE.md'"
          echo ""
          echo "You've successfully completed this step! Moving to step 3..."

      # In README.md, switch step 2 for step 3.
      - name: Update to step 3
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 2
          to_step: 3
          branch_name: my-first-branch
